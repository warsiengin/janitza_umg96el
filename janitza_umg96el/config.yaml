name: Janitza UMG 96-EL
version: "1.0.0"
slug: janitza_umg96el
description: Read UMG 96-EL measurements over Modbus TCP and publish Home Assistant MQTT sensors.
url: https://www.janitza.com/
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
init: false
options:
  host: 192.168.1.110
  port: 502
  unit_id: 1
  mqtt_host: 192.168.100.15
  mqtt_port: 1883
  mqtt_username: warsiengin
  mqtt_password: ""
  mqtt_topic_prefix: janitza_umg96el
  scan_interval: 30
schema:
  host: str
  port: int(1,65535)
  unit_id: int(0,247)
  mqtt_host: str
  mqtt_port: int(1,65535)
  mqtt_username: str
  mqtt_password: password
  mqtt_topic_prefix: str
  scan_interval: int(5,3600)
